name: Publish to Pages Maven repo

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK platform 35
        run: yes | sdkmanager "platforms;android-35" || true

      - name: Generate throwaway PGP key for CI signing
        run: |
          gpg --batch --passphrase '' --quick-generate-key "hvtest-pages-ci <ci@hvtest.local>" default default never
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          {
            echo "SIGNING_KEY<<PGPEOF"
            gpg --export-secret-keys --armor "$KEY_ID"
            echo "PGPEOF"
            echo "SIGNING_PASSWORD=ci"
          } >> "$GITHUB_ENV"

      - name: Publish to Maven Local
        env:
          CENTRAL_PORTAL_USER: dummy
          CENTRAL_PORTAL_PASSWORD: dummy
        run: ./gradlew deployLocal --no-daemon --stacktrace

      - name: Assemble Pages site
        run: |
          mkdir -p site
          # Carry forward previously published versions (1.x) so pinned consumers keep resolving;
          # the new build below overlays them.
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git archive gh-pages | tar -x -C site
          fi
          cp -r "$HOME/.m2/repository/org" site/org
          cp -r pages/. site/
          find site -name "*.jar" -size 0 -delete
          ls -R site | head -100

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "publish maven repo artifacts"
